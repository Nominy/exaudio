# Push a tag that matches crates/studio-app's version (e.g. v0.3.0) to build Exaudio natively
# for Windows, macOS (Apple silicon + Intel) and Linux, pack each with Velopack (one channel per
# platform: `win`, `osx-arm64`, `osx-x64`, `linux-x64`, `linux-arm64`) and publish ONE GitHub
# release with every installer, the update packages, the per-channel feed files and SHA256SUMS.
# Installed stable builds update from these releases; tags with a "-" become pre-releases,
# which stable builds ignore.
#
# Manual runs: `tag` rebuilds an existing tag; `dry_run` builds and checks every platform's
# packages from the current ref (or `tag`) as version `<next patch>-dry.<run>` (so delta
# packages against the latest release still get exercised) and keeps them as a workflow
# artifact without touching GitHub Releases.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release, e.g. v0.3.0 (a dry run may leave it empty to build this ref)
        required: false
        type: string
      dry_run:
        description: Build and check every platform's packages, publish nothing
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REPO_URL: https://github.com/Nominy/exaudio
  DRY_RUN: ${{ inputs.dry_run == true }}

jobs:
  prepare:
    name: Resolve the release
    # The app's stable updater reads Nominy/exaudio; forks must not publish look-alike releases.
    if: ${{ github.repository == 'Nominy/exaudio' }}
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}

    steps:
      - name: Check out the release ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check the tag matches the app version
        id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^version[[:space:]]*=/ { print $2; exit }' crates/studio-app/Cargo.toml)"
          if [[ "$DRY_RUN" == "true" ]]; then
            # Above the current release (Velopack refuses to pack at or below a feed's latest
            # version) and below the next one, like alpha builds.
            if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-.*)?$ ]]; then
              echo "::error::studio-app version must be major.minor.patch[-pre]; found '$version'." >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-dry.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            tag="v$version"
          else
            if [[ -n "$INPUT_TAG" ]]; then
              tag="$INPUT_TAG"
            elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              tag="$GITHUB_REF_NAME"
            else
              echo "::error::A tag is required unless dry_run is set." >&2
              exit 1
            fi
            if [[ "$tag" != "v$version" ]]; then
              echo "::error::Tag $tag does not match crates/studio-app version $version (expected v$version)." >&2
              exit 1
            fi
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "ref=$(git rev-parse HEAD)"
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing Exaudio $version as $tag (prerelease: $prerelease, dry run: $DRY_RUN)"

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          notes="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f "tag_name=$TAG" -f "target_commitish=$(git rev-parse HEAD)" --jq .body)"
          download="$REPO_URL/releases/download/$TAG"
          {
            echo "**Download:** Windows [Exaudio-win-Setup.exe]($download/Exaudio-win-Setup.exe) (installer) or [Exaudio-win-Portable.zip]($download/Exaudio-win-Portable.zip) (portable) · macOS [Apple silicon](${download}/Exaudio-mac-arm64.dmg) or [Intel](${download}/Exaudio-mac-x64.dmg) · Linux [x64 AppImage]($download/Exaudio-linux-x64.AppImage) or [arm64 AppImage]($download/Exaudio-linux-arm64.AppImage). Installed copies update themselves."
            echo
            echo "Exaudio is not code-signed yet: Windows SmartScreen may warn on first launch (More info -> Run anyway); macOS needs System Settings -> Privacy & Security -> Open Anyway once; the Linux AppImage needs \`chmod +x\`. Verify downloads against SHA256SUMS."
            echo
            printf '%s\n' "$notes"
          } > release-notes.md
          cat release-notes.md

      - name: Keep the release notes for the build jobs
        uses: actions/upload-artifact@v5
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            runner: windows-latest
            channel: win
            assets: Exaudio-win-Setup.exe Exaudio-win-Portable.zip
          - platform: mac-arm64
            runner: macos-15
            runtime: osx-arm64
            channel: osx-arm64
            assets: Exaudio-mac-arm64.dmg
          - platform: mac-x64
            runner: macos-15-intel
            runtime: osx-x64
            channel: osx-x64
            assets: Exaudio-mac-x64.dmg
          - platform: linux-x64
            runner: ubuntu-22.04
            runtime: linux-x64
            channel: linux-x64
            assets: Exaudio-linux-x64.AppImage
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            runtime: linux-arm64
            channel: linux-arm64
            assets: Exaudio-linux-arm64.AppImage

    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      STUDIO_BUILD_GIT_COMMIT: ${{ needs.prepare.outputs.ref }}
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' }}
      APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
      APPLE_DEVELOPER_ID_INSTALLER: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
      APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}

    steps:
      - name: Check out the release ref
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.platform }}

      - name: Install Linux build dependencies
        if: ${{ startsWith(matrix.platform, 'linux') }}
        uses: ./.github/actions/linux-build-deps

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore pinned Velopack CLI
        run: dotnet tool restore

      - name: Import Developer ID signing assets
        if: ${{ startsWith(matrix.platform, 'mac') && env.HAS_APPLE_CERTIFICATE == 'true' }}
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/exaudio-signing.keychain-db"
          cert_path="$RUNNER_TEMP/developer-id.p12"
          keychain_password="${APPLE_KEYCHAIN_PASSWORD:-temporary-keychain-password}"

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain"

          if [[ -n "${APPLE_NOTARY_PROFILE:-}" && -n "${APPLE_NOTARY_APPLE_ID:-}" && -n "${APPLE_NOTARY_TEAM_ID:-}" && -n "${APPLE_NOTARY_PASSWORD:-}" ]]; then
            xcrun notarytool store-credentials "$APPLE_NOTARY_PROFILE" \
              --apple-id "$APPLE_NOTARY_APPLE_ID" \
              --team-id "$APPLE_NOTARY_TEAM_ID" \
              --password "$APPLE_NOTARY_PASSWORD" \
              --keychain "$keychain"
          fi

          echo "APPLE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Fetch the release notes
        uses: actions/download-artifact@v6
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes

      - name: Prime the previous release for delta packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -uo pipefail
          release_dir="$GITHUB_WORKSPACE/target/velopack/Releases"
          mkdir -p "$release_dir"
          arguments=(download github --repoUrl "$REPO_URL" --channel "$CHANNEL" --token "$GH_TOKEN" --outputDir "$release_dir")
          if [[ "$PRERELEASE" == "true" ]]; then arguments+=(--pre); fi
          if ! dotnet tool run vpk -- "${arguments[@]}"; then
            echo "::warning::No previous $CHANNEL release to delta against; packaging full artifacts only."
            rm -rf "$release_dir"
            mkdir -p "$release_dir"
          fi
          exit 0

      - name: Build and package (Windows)
        if: ${{ matrix.platform == 'win' }}
        shell: pwsh
        run: ./tools/package-windows.ps1 -UpdateChannel stable -Version $env:VERSION -ReleaseNotes (Join-Path $env:RUNNER_TEMP "release-notes/release-notes.md")

      - name: Build and package (macOS / Linux)
        if: ${{ matrix.platform != 'win' }}
        shell: bash
        env:
          UPDATE_CHANNEL: stable
          RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          export RELEASE_NOTES="$RUNNER_TEMP/release-notes/release-notes.md"
          bash ./tools/package-unix.sh

      - name: Check the packages
        shell: bash
        env:
          ASSETS: ${{ matrix.assets }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          publish="target/velopack/Publish"
          for asset in $ASSETS "releases.$CHANNEL.json" "Exaudio-$VERSION-$([[ "$CHANNEL" == win ]] || printf '%s-' "$CHANNEL")full.nupkg"; do
            if [[ ! -s "$publish/$asset" ]]; then
              echo "::error::Packaging did not produce $asset" >&2
              ls -l "$publish" >&2
              exit 1
            fi
          done
          ls -l "$publish"

      - name: Upload the release payload
        uses: actions/upload-artifact@v5
        with:
          name: exaudio-${{ env.VERSION }}-${{ matrix.platform }}
          path: target/velopack/Publish/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Assemble and publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}

    steps:
      - name: Fetch every platform's payload
        uses: actions/download-artifact@v6
        with:
          pattern: exaudio-${{ env.VERSION }}-*
          path: payload

      - name: Fetch the release notes
        uses: actions/download-artifact@v6
        with:
          name: release-notes
          path: release-notes

      - name: Assemble the release assets and SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          python3 - payload dist <<'PY'
          import hashlib
          import json
          import pathlib
          import shutil
          import sys

          payload = pathlib.Path(sys.argv[1])
          dist = pathlib.Path(sys.argv[2])
          if dist.exists():
              shutil.rmtree(dist)
          dist.mkdir(parents=True)
          assets = {}
          manifests = sorted(payload.glob("*/publish-manifest.json"))
          if not manifests:
              raise SystemExit("no publish manifests found under payload/")
          for manifest_path in manifests:
              platform_dir = manifest_path.parent
              with manifest_path.open("r", encoding="utf-8-sig") as handle:
                  manifest = json.load(handle)
              for entry in manifest["Files"]:
                  name = entry["RelativeFileName"]
                  pure = pathlib.PurePosixPath(name)
                  if len(pure.parts) != 1 or pure.parts[0] in ("", ".", ".."):
                      raise SystemExit(f"{platform_dir.name}: unsafe publish path {name!r}")
                  # The per-channel Velopack asset index is a local packaging aid, not a release asset.
                  if name.startswith("assets.") and name.endswith(".json"):
                      continue
                  source = platform_dir / name
                  if not source.is_file():
                      raise SystemExit(f"{platform_dir.name}: missing {name}")
                  if source.stat().st_size != int(entry["Size"]):
                      raise SystemExit(f"{platform_dir.name}: size mismatch for {name}")
                  digest = hashlib.sha256(source.read_bytes()).hexdigest()
                  if digest.casefold() != str(entry["SHA256"]).casefold():
                      raise SystemExit(f"{platform_dir.name}: SHA-256 mismatch for {name}")
                  if name in assets:
                      raise SystemExit(f"{name} is produced by both {assets[name][0]} and {platform_dir.name}")
                  assets[name] = (platform_dir.name, entry["Kind"], digest, source.stat().st_size)
                  shutil.copy2(source, dist / name)
          sums = [f"{digest}  {name}\n" for name, (_, kind, digest, _) in sorted(assets.items()) if kind == "asset"]
          (dist / "SHA256SUMS").write_text("".join(sums), encoding="utf-8")
          width = max(len(name) for name in assets) + 1
          print(f"{'asset':<{width}} {'bytes':>12}  platform")
          for name, (platform, kind, _, size) in sorted(assets.items()):
              print(f"{name:<{width}} {size:>12}  {platform} ({kind})")
          PY
          echo
          echo "SHA256SUMS:"
          cat dist/SHA256SUMS
          (cd dist && sha256sum --check --strict SHA256SUMS)

      - name: Keep the assembled release
        uses: actions/upload-artifact@v5
        with:
          name: exaudio-${{ env.VERSION }}-release
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Create or update the GitHub release
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="release-notes/release-notes.md"
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its assets."
          else
            arguments=(release create "$TAG" --verify-tag --draft --title "Exaudio $VERSION" --notes-file "$notes")
            if [[ "$PRERELEASE" == "true" ]]; then arguments+=(--prerelease); fi
            gh "${arguments[@]}"
          fi
          # Assets land while the release is still a draft; installed apps only see it once published.
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --notes-file "$notes" --draft=false
          gh release view "$TAG" --json url,isPrerelease,assets --jq '{url, isPrerelease, assets: [.assets[] | {name, size}]}'
