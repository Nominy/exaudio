# Manual: builds Exaudio natively on GitHub-hosted macOS runners, packs it with Velopack
# (channel `alpha`, tools/package-unix.sh) and optionally publishes it to the per-target VPS
# alpha feed.
name: macOS Alpha

on:
  workflow_dispatch:
    inputs:
      target:
        description: macOS build target
        required: true
        default: all
        type: choice
        options:
          - all
          - latest-arm64
          - latest-amd64
          - sonoma-amd64
      publish_to_vps:
        description: Publish artifacts to the VPS feed after packaging.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: alpha-macos
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CHANNEL: alpha

jobs:
  select-targets:
    name: Select macOS targets
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}

    steps:
      - name: Build target matrix
        id: targets
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          latest_arm64='{"target":"latest-arm64","runner":"macos-15","runtime":"osx-arm64","feed_suffix":"mac-arm64"}'
          latest_amd64='{"target":"latest-amd64","runner":"macos-15-intel","runtime":"osx-x64","feed_suffix":"mac-x64"}'
          sonoma_amd64='{"target":"sonoma-amd64","runner":"macos-14-large","runtime":"osx-x64","feed_suffix":"mac-sonoma-x64"}'

          case "$TARGET" in
            all) matrix="{\"include\":[$latest_arm64,$latest_amd64,$sonoma_amd64]}" ;;
            latest-arm64) matrix="{\"include\":[$latest_arm64]}" ;;
            latest-amd64) matrix="{\"include\":[$latest_amd64]}" ;;
            sonoma-amd64) matrix="{\"include\":[$sonoma_amd64]}" ;;
            *)
              echo "Unknown target: $TARGET" >&2
              exit 1
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  package:
    name: Package macOS alpha (${{ matrix.target }})
    needs: select-targets
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-targets.outputs.matrix) }}

    env:
      RUNTIME: ${{ matrix.runtime }}
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      STUDIO_ALPHA_FEED_URL: https://reviewgen.ovh/exaudio/alpha/${{ matrix.feed_suffix }}
      REMOTE_PATH: /var/www/exaudio/alpha/${{ matrix.feed_suffix }}
      FEED_SUFFIX: ${{ matrix.feed_suffix }}
      PUBLISH_DIR: ${{ github.workspace }}/target/velopack/Publish
      STUDIO_BUILD_GIT_COMMIT: ${{ github.sha }}
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' }}
      APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
      APPLE_DEVELOPER_ID_INSTALLER: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
      APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve the alpha version
        shell: bash
        run: |
          set -euo pipefail
          base="$(awk -F '"' '/^version[[:space:]]*=/ { print $2; exit }' crates/studio-app/Cargo.toml)"
          if [[ ! "$base" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "studio-app version must be numeric major.minor.patch; found '$base'." >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-alpha.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Alpha version: $version"

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore pinned Velopack CLI
        run: dotnet tool restore

      - name: Import Developer ID signing assets
        if: ${{ env.HAS_APPLE_CERTIFICATE == 'true' }}
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/exaudio-signing.keychain-db"
          cert_path="$RUNNER_TEMP/developer-id.p12"
          keychain_password="${APPLE_KEYCHAIN_PASSWORD:-temporary-keychain-password}"

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain"

          if [[ -n "${APPLE_NOTARY_PROFILE:-}" && -n "${APPLE_NOTARY_APPLE_ID:-}" && -n "${APPLE_NOTARY_TEAM_ID:-}" && -n "${APPLE_NOTARY_PASSWORD:-}" ]]; then
            xcrun notarytool store-credentials "$APPLE_NOTARY_PROFILE" \
              --apple-id "$APPLE_NOTARY_APPLE_ID" \
              --team-id "$APPLE_NOTARY_TEAM_ID" \
              --password "$APPLE_NOTARY_PASSWORD" \
              --keychain "$keychain"
          fi

          echo "APPLE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build and package
        shell: bash
        env:
          UPDATE_CHANNEL: alpha
        run: |
          rm -rf target/velopack/Releases target/velopack/Publish
          bash ./tools/package-unix.sh

      - name: Publish artifacts to VPS
        if: ${{ inputs.publish_to_vps }}
        shell: bash
        env:
          ALPHA_SSH_HOST: ${{ secrets.ALPHA_SSH_HOST }}
          ALPHA_SSH_USER: ${{ secrets.ALPHA_SSH_USER }}
          ALPHA_SSH_PRIVATE_KEY: ${{ secrets.ALPHA_SSH_PRIVATE_KEY }}
          ALPHA_SSH_PORT: ${{ secrets.ALPHA_SSH_PORT }}
          ALPHA_SSH_KNOWN_HOSTS: ${{ secrets.ALPHA_SSH_KNOWN_HOSTS }}
        run: bash ./tools/publish-alpha-unix.sh

      - name: Upload Velopack publish payload
        uses: actions/upload-artifact@v5
        with:
          name: exaudio-alpha-${{ matrix.target }}
          path: target/velopack/Publish/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
